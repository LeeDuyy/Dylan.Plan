server {
  listen 80;
  server_name dylan.com.vn www.dylan.com.vn plan.dylan.com.vn;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ── Dylan Design System (showcase + storybook) ────────────────────────
# Static content lives in the `dylan-ds-nginx` container (deployed from the
# VN.Dylan.DesignSystem repo). Resolve it lazily via Docker DNS so this
# config still loads when that container is not up yet.
server {
  listen 80;
  server_name showcase.dylan.com.vn storybook.dylan.com.vn;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name showcase.dylan.com.vn storybook.dylan.com.vn;

  ssl_certificate /etc/letsencrypt/live/dylan.com.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dylan.com.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  resolver 127.0.0.11 valid=10s;
  set $ds_upstream dylan-ds-nginx;

  location / {
    proxy_pass http://$ds_upstream:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name dylan.com.vn www.dylan.com.vn plan.dylan.com.vn;

  ssl_certificate /etc/letsencrypt/live/dylan.com.vn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dylan.com.vn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 20m;

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
  }
}
