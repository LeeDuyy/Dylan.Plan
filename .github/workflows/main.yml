name: Main CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare deploy artifact
        run: |
          mkdir -p deploy/app/.next deploy/nginx deploy/migrate/prisma
          cp -R .next/standalone/. deploy/app/
          cp -R .next/static deploy/app/.next/static
          cp -R public deploy/app/public
          cp compose.yaml deploy/compose.yaml
          cp nginx/default.conf deploy/nginx/default.conf
          cp prisma/schema.prisma deploy/migrate/prisma/schema.prisma
          cp -R prisma/migrations deploy/migrate/prisma/migrations
          cp prisma.config.ts deploy/migrate/prisma.config.ts
          cat > deploy/migrate/package.json <<'JSON'
          {
            "name": "dylan-plan-migrate",
            "private": true,
            "dependencies": {
              "prisma": "7.9.1"
            }
          }
          JSON

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: dylan-plan-runtime
          path: deploy/
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      VPS_HOST: 103.72.97.160
      VPS_PORT: 24700
      VPS_PATH: /mnt/SourceCode/DylanPlan

    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: dylan-plan-runtime
          path: deploy

      - name: Start ssh-agent
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=${SSH_AUTH_SOCK}" >> "${GITHUB_ENV}"
          echo "SSH_AGENT_PID=${SSH_AGENT_PID}" >> "${GITHUB_ENV}"

          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          cat > ~/.ssh/askpass.sh <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF
          chmod +x ~/.ssh/askpass.sh

          DISPLAY=:0 \
          SSH_ASKPASS="$HOME/.ssh/askpass.sh" \
          SSH_ASKPASS_REQUIRE=force \
          setsid -w ssh-add ~/.ssh/id_ed25519 </dev/null

      - name: Trust VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${VPS_PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Prepare VPS directory
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${VPS_PORT}" "${{ secrets.VPS_USER }}@${VPS_HOST}" \
            "mkdir -p ${VPS_PATH} /mnt/SourceCode/DylanPlan-data"

      - name: Sync runtime artifact to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p ${VPS_PORT}" \
            deploy/ "${{ secrets.VPS_USER }}@${VPS_HOST}:${VPS_PATH}/"

      - name: Run database migrations
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${VPS_PORT}" "${{ secrets.VPS_USER }}@${VPS_HOST}" "bash -s" <<EOF
          set -e
          SUDO=""
          if [ "\$(id -u)" != "0" ]; then
            SUDO="sudo"
          fi
          \$SUDO docker run --rm \
            -v ${VPS_PATH}/migrate:/migrate \
            -v /mnt/SourceCode/DylanPlan-data:/data \
            -w /migrate \
            -e DATABASE_URL=file:/data/dylan-plan.db \
            node:22-bookworm-slim \
            sh -c "npm install --omit=dev --no-audit --no-fund >/dev/null && npx prisma migrate deploy"
          EOF

      - name: Deploy with Docker Compose
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${VPS_PORT}" "${{ secrets.VPS_USER }}@${VPS_HOST}" <<'EOF'
          set -e
          cd /mnt/SourceCode/DylanPlan

          SUDO=""
          if [ "$(id -u)" != "0" ]; then
            SUDO="sudo"
          fi

          $SUDO mkdir -p /var/www/certbot
          if $SUDO test -d /etc/nginx; then
            $SUDO systemctl stop nginx || true
          fi

          docker compose up -d --force-recreate --remove-orphans
          EOF

      - name: Smoke test deployed app
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${VPS_PORT}" "${{ secrets.VPS_USER }}@${VPS_HOST}" "bash -s" <<'EOF'
          set -e
          cd /mnt/SourceCode/DylanPlan

          # portfolio must be served at the root domain
          curl -k -fsS --compressed --retry 10 --retry-delay 3 -H 'Host: dylan.com.vn' https://127.0.0.1/ -o /tmp/dylan-plan-local.html
          if ! grep -q 'Full-stack Engineer' /tmp/dylan-plan-local.html; then
            echo "Local Docker HTTPS endpoint did not return the portfolio marker."
            head -80 /tmp/dylan-plan-local.html
            docker compose ps
            docker compose logs --tail=100 app nginx
            exit 1
          fi

          # dashboard routes must NOT be reachable on the root domain
          for route in budget roadmap; do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 -H 'Host: dylan.com.vn' "https://127.0.0.1/${route}")
            if [ "$code" != "404" ]; then
              echo "Local Docker HTTPS endpoint for /${route} on dylan.com.vn expected 404, got ${code}."
              docker compose ps
              docker compose logs --tail=100 app nginx
              exit 1
            fi
          done

          # dashboard subdomain must require auth (never 200 without a session)
          code=$(curl -k -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 -H 'Host: plan.dylan.com.vn' https://127.0.0.1/)
          if [ "$code" = "200" ]; then
            echo "plan.dylan.com.vn returned 200 without authentication — auth gate is not active."
            docker compose ps
            docker compose logs --tail=100 app nginx
            exit 1
          fi
          EOF

          curl -k -fsS --compressed --retry 10 --retry-delay 3 https://dylan.com.vn/ -o /tmp/dylan-plan-public.html
          if ! grep -q 'Full-stack Engineer' /tmp/dylan-plan-public.html; then
            echo "Public HTTPS endpoint did not return the portfolio marker."
            head -80 /tmp/dylan-plan-public.html
            exit 1
          fi

          for route in budget roadmap; do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 "https://dylan.com.vn/${route}")
            if [ "$code" != "404" ]; then
              echo "Public HTTPS endpoint for /${route} on dylan.com.vn expected 404, got ${code}."
              exit 1
            fi
          done

          code=$(curl -k -s -o /dev/null -w '%{http_code}' --retry 10 --retry-delay 3 https://plan.dylan.com.vn/)
          if [ "$code" = "200" ]; then
            echo "Public plan.dylan.com.vn returned 200 without authentication — auth gate is not active."
            exit 1
          fi

      - name: Show Docker Compose diagnostics
        if: failure()
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -p "${VPS_PORT}" "${{ secrets.VPS_USER }}@${VPS_HOST}" "cd ${VPS_PATH} && docker compose ps && docker compose logs --tail=100"
